---
- name: Wait for system to be ready
  wait_for_connection:
    timeout: 60

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: safe
  when: upgrade_packages | default(false)

- name: Install required base packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - python3-setuptools
      - software-properties-common
      - git
      - vim
      - htop
      - tree
    state: present

- name: Install python Docker module
  pip:
    name:
      - docker
      - docker-compose
    state: present

- name: Set timezone
  timezone:
    name: UTC

- name: Create application directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ app_root }}"
    - "{{ data_root }}"
    - "{{ db_host_path }}"
    - "{{ wp_host_path }}"

- name: Set correct permissions for data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - "{{ db_host_path }}"
    - "{{ wp_host_path }}"
