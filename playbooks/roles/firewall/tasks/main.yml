---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Reset UFW to default
  ufw:
    state: reset

- name: Set default incoming policy to deny
  ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow public TCP ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Allow FTP ports if enabled
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ftp_ports | default([]) }}"
  when: enable_ftp | default(false)

- name: Enable UFW
  ufw:
    state: enabled
    logging: 'on'

- name: Display firewall status
  command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show firewall status
  debug:
    var: ufw_status.stdout_lines
