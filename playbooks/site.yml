---
- name: Cloud-1 - Full Deployment
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Validate required environment variables
      assert:
        that:
          - lookup('env', 'DB_ROOT_PASSWORD') != ''
          - lookup('env', 'DB_PASSWORD') != ''
          - lookup('env', 'WP_ADMIN_PASSWORD') != ''
          - lookup('env', 'WP_USER_PASSWORD') != ''
        fail_msg: |
          Required environment variables are not set! Please export:
            - DB_ROOT_PASSWORD
            - DB_PASSWORD
            - WP_ADMIN_PASSWORD
            - WP_USER_PASSWORD
          
        success_msg: "All required environment variables are set"

    - name: Display deployment info
      debug:
        msg: |
          Cloud-1 Deployment
          Target Server: {{ ansible_host }}
          Domain: {{ domain_name }}
          App Root: {{ app_root }}
  roles:
    - role: common
      tags: [common, setup]
    
    - role: docker
      tags: [docker, setup]
    
    - role: firewall
      tags: [firewall, security]
    
    - role: cloudone
      tags: [cloudone, deploy]

  post_tasks:
    - name: Verify all containers are running
      command: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: docker_ps
      changed_when: false

    - name: Display running containers
      debug:
        var: docker_ps.stdout_lines

    - name: Final success message
      debug:
        msg: |
          DEPLOYMENT COMPLETE
          Sites:
            WordPress: https://{{ domain_name }}
            WP Admin:  https://{{ domain_name }}/wp-admin
          Credentials:
            Username: {{ wp_admin_user }}
            Password: (your WP_ADMIN_PASSWORD)
          SSH tunnel:
            ssh -L 8081:localhost:8081 root@{{ ansible_host }}
            (then open http://localhost:8081)
